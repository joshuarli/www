<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8e4e5">
  <meta name="description" content="Joshua Li — software and systems.">
  <title>Joshua Li</title>
  <link rel="preload" as="image" href="bg-poster.jpg" type="image/jpeg">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: #d8e4e5; }
    body {
      min-height: 100svh;
      margin: 0;
      color: #243237;
      font: 18px/1.45 Georgia, 'Times New Roman', serif;
      background: #d8e4e5;
      overflow-x: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100svh;
      max-width: 34rem;
      margin-left: clamp(1.5rem, 13vw, 13rem);
      padding: 4rem 1.5rem 5rem 0;
      text-shadow: 0 1px 20px #f7f6efd9;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.7rem, 6vw, 4.75rem);
      line-height: 1.08;
      letter-spacing: -.065em;
      font-weight: normal;
    }
    p { margin: 0 0 1.65rem; font-size: clamp(1rem, 1.7vw, 1.2rem); }
    a {
      color: inherit;
      font-size: 1rem;
      text-decoration-thickness: 1px;
      text-underline-offset: .25em;
      transition: text-underline-offset .2s ease;
    }
    a:hover { text-underline-offset: .38em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    @media (max-width: 560px) {
      main { margin-left: 1.5rem; padding-right: 1.5rem; }
      h1 { font-size: clamp(2.65rem, 12vw, 4.25rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg { display: none; }
      body {
        background-image: url(bg-poster.jpg);
        background-size: cover;
        background-position: center;
      }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="bg-poster.jpg" aria-hidden="true" tabindex="-1" disablepictureinpicture>
    <source src="bg.mp4" type="video/mp4">
  </video>
  <main>
    <h1>hi, i'm josh.</h1>
    <p>i build software and systems.</p>
    <a href="https://github.com/joshuarli" rel="me">github ↗</a>
  </main>
  <script>
    const v = document.querySelector('.bg');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const conn = navigator.connection;
    const saveData = () => conn?.saveData || ['slow-2g', '2g'].includes(conn?.effectiveType);
    const shouldPause = () => reduced.matches || saveData();
    if (shouldPause()) {
      v.pause();
      v.removeAttribute('autoplay');
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) v.pause();
      else if (!shouldPause()) v.play().catch(() => {});
    });
  </script>
</body>
</html>
